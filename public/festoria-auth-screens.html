<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  <title>Festoria Organizer - Login &amp; Sign Up</title>
  <!-- Tailwind CSS CDN with forms and container queries -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              dark: '#0d5c58',
              primary: '#116963',
              accent: '#198078',
              mint: '#86e3ce',
              softmint: '#e6f7f5',
              surface: '#f3f7f6',
              border: '#e2ece9'
            }
          },
          boxShadow: {
            'phone': '0 25px 60px -15px rgba(13, 92, 88, 0.22), 0 0 25px rgba(0, 0, 0, 0.04)',
            'card': '0 -10px 30px rgba(0, 0, 0, 0.05)',
            'social': '0 3px 8px rgba(0, 0, 0, 0.05)'
          }
        }
      }
    }
  </script>
  <!-- BEGIN: Custom Styles -->
  <style data-purpose="base-enhancements">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    /* Smooth transitions for tab switching */
    .tab-transition {
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Subtle custom scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
  <style data-purpose="illustrations">
    /* Botanical leaf and organic shape styles */
    .leaf-stem {
      transform-origin: bottom center;
    }
    .plant-bounce {
      animation: soft-sway 6s ease-in-out infinite alternate;
    }
    @keyframes soft-sway {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(1.5deg); }
      100% { transform: rotate(-1deg); }
    }
  </style>
  <!-- END: Custom Styles -->
</head>
<body class="bg-gradient-to-br from-[#d9f5f0] via-[#c6eee7] to-[#b7e7df] min-h-screen py-8 px-4 flex flex-col items-center justify-center text-slate-800 antialiased">

  <!-- BEGIN: Dual-View Control Header (Desktop/Tablet Helper) -->
  <header class="mb-6 flex flex-col sm:flex-row items-center gap-3 bg-white/70 backdrop-blur-md px-5 py-2.5 rounded-full border border-teal-600/15 shadow-sm">
    <div class="flex items-center gap-2 text-xs font-semibold text-brand-dark">
      <span class="w-2.5 h-2.5 rounded-full bg-brand-primary"></span>
      <span>Preview Mode:</span>
      <span class="text-slate-500 font-normal" id="current-mode-label">Dual View</span>
    </div>
    <div class="flex items-center gap-1.5 bg-slate-200/60 p-1 rounded-full text-xs font-medium">
      <button id="toggle-split-btn" type="button" class="px-3 py-1 rounded-full bg-white text-brand-dark shadow-xs transition-all">Side-by-Side</button>
      <button id="toggle-screen-btn" type="button" class="px-3 py-1 rounded-full text-slate-600 hover:text-slate-900 transition-all">Single Screen</button>
    </div>
  </header>
  <!-- END: Dual-View Control Header -->

  <!-- BEGIN: Phone Screens Canvas Container -->
  <main class="flex flex-wrap items-center justify-center gap-8 lg:gap-12 w-full max-w-5xl transition-all duration-500" id="app-container">

    <!-- ============================================== -->
    <!-- SCREEN 1: LOGIN VIEW                           -->
    <!-- ============================================== -->
    <!-- BEGIN: LoginScreen -->
    <section class="w-full max-w-[375px] bg-[#0d5c58] shadow-phone overflow-hidden relative border-white flex flex-col justify-between transition-all duration-300 transform rounded-2xl shadow-md" id="login-phone">
      <!-- Top Teal Section (~38% height) -->
      <header class="relative w-full h-[270px] bg-[#0d5c58] px-7 flex flex-col justify-between overflow-hidden pt-7">
        <!-- Decorative Abstract Mint Organic Blob (Top Left) -->
        <div class="absolute -top-10 -left-12 w-44 h-44 bg-[#8ee6d3] rounded-full opacity-90 mix-blend-screen pointer-events-none transform -rotate-12 filter blur-[0.5px]">
          <div class="w-full h-full rounded-full border-[10px] border-[#69d9c2] opacity-40"></div>
        </div>
        <div class="absolute -top-4 left-6 w-24 h-24 bg-[#76dec8] rounded-full opacity-70"></div>

        <!-- Greeting Copy -->
        <div class="z-20 mt-4 mb-3">
          <h1 class="text-white text-3xl font-extrabold tracking-tight">Hello!</h1>
          <p class="text-teal-100/90 text-sm font-medium mt-1">Welcome to Festoria</p>
        </div>

        <!-- Decorative Botanical Plant in Minimal Ceramic Pot -->
        <div class="absolute right-5 bottom-0 z-30 flex flex-col items-center plant-bounce pointer-events-none" style="transform-origin: bottom center;">
          <!-- Foliage / Leaves (SVG paths) -->
          <svg class="w-24 h-36 drop-shadow-md" fill="none" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 8C43 45 44 80 50 120C56 80 57 45 50 8Z" fill="#58c4aa"></path>
            <path d="M50 18C47 48 48 78 50 120C53 78 54 48 50 18Z" fill="#7de0ca"></path>
            <path d="M48 60C30 50 18 20 20 8C20 30 32 70 49 95Z" fill="#44b499"></path>
            <path d="M52 50C68 35 78 12 76 5C76 25 66 65 51 90Z" fill="#6ad2bc"></path>
            <path d="M50 75C40 70 32 55 35 48C38 60 44 75 50 85Z" fill="#88ebd6"></path>
          </svg>
          <!-- Ceramic Pot -->
          <div class="w-14 h-12 bg-white rounded-b-xl rounded-t-xs shadow-md flex items-center justify-center border-t-2 border-slate-100 -mt-1 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-tr from-slate-100 to-transparent"></div>
            <div class="w-2.5 h-1.5 bg-[#44b499]/20 rounded-full"></div>
          </div>
        </div>
      </header>

      <!-- Bottom White Card Section (~62% height) -->
      <section class="relative w-full bg-white rounded-t-[38px] px-7 pt-7 pb-6 flex flex-col justify-between shadow-card z-20 flex-1">
        <div class="space-y-4">
          <!-- Card Header Title & Status -->
          <div class="flex items-center justify-between pb-1">
            <div class="flex items-center space-x-2">
              <h2 class="text-2xl font-bold text-brand-dark tracking-tight">Login</h2>
              <span class="w-2 h-2 rounded-full bg-brand-primary inline-block animate-pulse"></span>
            </div>
            <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-brand-softmint text-brand-dark border border-brand-mint/40">
              Organizer Portal
            </span>
          </div>

          <!-- Login Form Fields -->
          <form class="space-y-3" onsubmit="event.preventDefault(); alert('Login submitted!');">
            <!-- Username/Phone Input -->
            <div class="relative flex items-center">
              <span class="absolute left-4 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                </svg>
              </span>
              <input class="w-full bg-brand-surface hover:bg-slate-100/80 focus:bg-white text-slate-700 placeholder-slate-400 text-sm font-medium rounded-full py-3.5 pl-12 pr-4 border border-transparent focus:border-brand-primary focus:ring-2 focus:ring-brand-mint/30 outline-none transition duration-200" placeholder="Username or Mobile" required="" type="text"/>
            </div>

            <!-- Password Input -->
            <div class="relative flex items-center">
              <span class="absolute left-4 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                </svg>
              </span>
              <input class="w-full bg-brand-surface hover:bg-slate-100/80 focus:bg-white text-slate-700 placeholder-slate-400 text-sm font-medium rounded-full py-3.5 pl-12 pr-12 border border-transparent focus:border-brand-primary focus:ring-2 focus:ring-brand-mint/30 outline-none transition duration-200" id="login-password" placeholder="Password" required="" type="password"/>
              <button class="absolute right-4 text-slate-400 hover:text-slate-600 focus:outline-none" onclick="toggleLoginPassword()" type="button">
                <svg class="w-4 h-4" fill="none" id="eye-icon-login" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                  <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                </svg>
              </button>
            </div>

            <!-- Forgot Password -->
            <div class="flex justify-end pr-1 pt-0.5">
              <a class="text-xs font-semibold text-brand-dark/80 hover:text-brand-dark transition" href="#">Forgot Password?</a>
            </div>

            <!-- Primary Login Button -->
            <div class="pt-1">
              <button class="w-full bg-[#0d5c58] hover:bg-[#116963] active:scale-[0.98] text-white font-semibold py-3.5 px-6 rounded-full shadow-md text-sm tracking-wide transition-all duration-150 flex items-center justify-center space-x-2 cursor-pointer" type="submit">
                <span>Login</span>
              </button>
            </div>
          </form>

          <!-- Social Login Divider & Icons -->
          <div class="space-y-3 pt-1">
            <div class="relative flex items-center justify-center">
              <div class="border-t border-slate-200 w-full"></div>
              <span class="bg-white px-3 text-[11px] font-semibold text-slate-400 uppercase tracking-wider">or</span>
            </div>

            <div class="flex items-center justify-center gap-3">
              <button aria-label="Sign in with Facebook" class="w-11 h-11 rounded-full border border-slate-200 hover:border-brand-accent bg-white hover:bg-slate-50 flex items-center justify-center shadow-social transition transform active:scale-95" type="button">
                <svg class="w-5 h-5 text-[#1877F2] fill-current" viewBox="0 0 24 24">
                  <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path>
                </svg>
              </button>

              <button aria-label="Sign in with Google" class="w-11 h-11 rounded-full border border-slate-200 hover:border-brand-accent bg-white hover:bg-slate-50 flex items-center justify-center shadow-social transition transform active:scale-95" type="button">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                  <path d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z" fill="#4285F4"></path>
                  <path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.94H1.26v3.15C3.26 21.36 7.34 24 12 24z" fill="#34A853"></path>
                  <path d="M5.28 14.26c-.25-.72-.38-1.49-.38-2.26s.13-1.54.38-2.26V6.59H1.26C.46 8.18 0 9.99 0 12s.46 3.82 1.26 5.41l4.02-3.15z" fill="#FBBC05"></path>
                  <path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.26 6.59l4.02 3.15c.95-2.84 3.6-4.99 6.72-4.99z" fill="#EA4335"></path>
                </svg>
              </button>

              <button aria-label="Sign in with Apple" class="w-11 h-11 rounded-full border border-slate-200 hover:border-brand-accent bg-white hover:bg-slate-50 flex items-center justify-center shadow-social transition transform active:scale-95" type="button">
                <svg class="w-5 h-5 text-black fill-current" viewBox="0 0 24 24">
                  <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.64-.78 1.08-1.86.96-2.95-1 .04-2.16.66-2.83 1.45-.58.67-1.09 1.77-.96 2.82 1.12.09 2.21-.57 2.83-1.32z"></path>
                </svg>
              </button>
            </div>

            <!-- Bottom Navigation Switcher -->
            <p class="text-center text-xs text-slate-500 font-medium">
              Don't have an account? 
              <button class="text-brand-primary font-bold hover:underline ml-1 focus:outline-none" onclick="switchToSignUp()" type="button">Sign Up</button>
            </p>
          </div>
        </div>
      </section>
      <!-- END: LoginCard -->
    </section>
    <!-- END: LoginScreen -->

    <!-- ============================================== -->
    <!-- SCREEN 2: SIGN UP VIEW                         -->
    <!-- ============================================== -->
    <!-- BEGIN: SignUpScreen -->
    <section class="w-full max-w-[375px] bg-[#0d5c58] shadow-phone overflow-hidden relative border-white flex flex-col justify-between transition-all duration-300 transform rounded-2xl shadow-md" id="signup-phone">
      <!-- Top Teal Section (~38% height) -->
      <header class="relative w-full h-[270px] bg-[#0d5c58] px-7 flex flex-col justify-between overflow-hidden pt-7">
        <!-- Decorative Abstract Mint Organic Blobs -->
        <div class="absolute -top-12 -left-10 w-48 h-48 bg-[#8ee6d3] rounded-full opacity-90 mix-blend-screen pointer-events-none transform rotate-45 filter blur-[0.5px]">
          <div class="w-full h-full rounded-full border-[10px] border-[#69d9c2] opacity-40"></div>
        </div>
        <div class="absolute -top-2 left-10 w-20 h-20 bg-[#76dec8] rounded-full opacity-70"></div>
        <div class="absolute top-16 -left-4 w-12 h-12 bg-[#88ebd6] rounded-full opacity-50"></div>

        <!-- Greeting Copy -->
        <div class="z-20 mt-4 mb-3">
          <h1 class="text-white text-3xl font-extrabold tracking-tight">Join Us!</h1>
          <p class="text-teal-100/90 text-sm font-medium mt-1">Create your Festoria account</p>
        </div>

        <!-- Decorative Botanical Plant in Minimal Ceramic Pot -->
        <div class="absolute right-5 bottom-0 z-30 flex flex-col items-center plant-bounce pointer-events-none" style="transform-origin: bottom center;">
          <!-- Foliage / Leaves (SVG paths) -->
          <svg class="w-24 h-36 drop-shadow-md" fill="none" viewBox="0 0 100 150" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 8C43 45 44 80 50 120C56 80 57 45 50 8Z" fill="#58c4aa"></path>
            <path d="M50 18C47 48 48 78 50 120C53 78 54 48 50 18Z" fill="#7de0ca"></path>
            <path d="M48 60C30 50 18 20 20 8C20 30 32 70 49 95Z" fill="#44b499"></path>
            <path d="M52 50C68 35 78 12 76 5C76 25 66 65 51 90Z" fill="#6ad2bc"></path>
            <path d="M50 75C40 70 32 55 35 48C38 60 44 75 50 85Z" fill="#88ebd6"></path>
          </svg>
          <!-- Ceramic Pot -->
          <div class="w-14 h-12 bg-white rounded-b-xl rounded-t-xs shadow-md flex items-center justify-center border-t-2 border-slate-100 -mt-1 relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-tr from-slate-100 to-transparent"></div>
            <div class="w-2.5 h-1.5 bg-[#44b499]/20 rounded-full"></div>
          </div>
        </div>
      </header>

      <!-- Bottom White Card Section (~62% height) -->
      <section class="relative w-full bg-white rounded-t-[38px] px-7 pt-7 pb-6 flex flex-col justify-between shadow-card z-20 flex-1">
        <div class="space-y-3.5">
          <!-- Card Header Title & Status -->
          <div class="flex items-center justify-between pb-1">
            <div class="flex items-center space-x-2">
              <h2 class="text-2xl font-bold text-brand-dark tracking-tight">Sign Up</h2>
              <span class="w-2 h-2 rounded-full bg-brand-primary inline-block animate-pulse"></span>
            </div>
            <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold bg-brand-softmint text-brand-dark border border-brand-mint/40">
              Participant &amp; Organizer
            </span>
          </div>

          <!-- Sign Up Form Fields -->
          <form class="space-y-3" onsubmit="event.preventDefault(); alert('Account registration submitted!');">
            <!-- Full Name Input -->
            <div class="relative flex items-center">
              <span class="absolute left-4 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                </svg>
              </span>
              <input class="w-full bg-brand-surface hover:bg-slate-100/80 focus:bg-white text-slate-700 placeholder-slate-400 text-sm font-medium rounded-full py-3.5 pl-12 pr-4 border border-transparent focus:border-brand-primary focus:ring-2 focus:ring-brand-mint/30 outline-none transition duration-200" placeholder="Full Legal Name" required="" type="text"/>
            </div>

            <!-- Email Input -->
            <div class="relative flex items-center">
              <span class="absolute left-4 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                </svg>
              </span>
              <input class="w-full bg-brand-surface hover:bg-slate-100/80 focus:bg-white text-slate-700 placeholder-slate-400 text-sm font-medium rounded-full py-3.5 pl-12 pr-4 border border-transparent focus:border-brand-primary focus:ring-2 focus:ring-brand-mint/30 outline-none transition duration-200" placeholder="Email Address" required="" type="email"/>
            </div>

            <!-- Mobile Phone Input -->
            <div class="relative flex items-center">
              <span class="absolute left-4 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                </svg>
              </span>
              <input class="w-full bg-brand-surface hover:bg-slate-100/80 focus:bg-white text-slate-700 placeholder-slate-400 text-sm font-medium rounded-full py-3.5 pl-12 pr-4 border border-transparent focus:border-brand-primary focus:ring-2 focus:ring-brand-mint/30 outline-none transition duration-200" placeholder="Mobile Number (10 digits)" required="" type="tel"/>
            </div>

            <!-- Password Input with Eye Toggle -->
            <div class="relative flex items-center">
              <span class="absolute left-4 text-slate-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                </svg>
              </span>
              <input class="w-full bg-brand-surface hover:bg-slate-100/80 focus:bg-white text-slate-700 placeholder-slate-400 text-sm font-medium rounded-full py-3.5 pl-12 pr-12 border border-transparent focus:border-brand-primary focus:ring-2 focus:ring-brand-mint/30 outline-none transition duration-200" id="signup-password" minlength="6" placeholder="Password (Min 6 chars)" required="" type="password"/>
              <button class="absolute right-4 text-slate-400 hover:text-slate-600 focus:outline-none" onclick="toggleSignUpPassword()" type="button">
                <svg class="w-4 h-4" fill="none" id="eye-icon-signup" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                  <path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
                </svg>
              </button>
            </div>

            <!-- Terms & Privacy Agreement Checkbox -->
            <div class="flex items-start gap-2 pt-0.5 px-2">
              <input class="mt-0.5 rounded text-brand-primary focus:ring-brand-primary border-slate-300 w-3.5 h-3.5" id="terms-agree" required="" type="checkbox"/>
              <label class="text-[11px] text-slate-500 font-medium leading-tight" for="terms-agree">
                I agree to the <a class="text-brand-dark underline font-semibold" href="#">Terms of Service</a> &amp; <a class="text-brand-dark underline font-semibold" href="#">Privacy Policy</a>
              </label>
            </div>

            <!-- Primary Sign Up Button -->
            <div class="pt-1">

  <!-- BEGIN: Interactive Switcher Logic -->
  <script data-purpose="view-interactions">
    const loginPhone = document.getElementById('login-phone');
    const signupPhone = document.getElementById('signup-phone');
    const toggleSplitBtn = document.getElementById('toggle-split-btn');
    const toggleScreenBtn = document.getElementById('toggle-screen-btn');
    const currentModeLabel = document.getElementById('current-mode-label');

    let isDualMode = true;
    let currentSingleView = 'login'; // 'login' or 'signup'

    function updateView() {
      if (isDualMode) {
        loginPhone.classList.remove('hidden');
        signupPhone.classList.remove('hidden');
        toggleSplitBtn.classList.add('bg-white', 'text-brand-dark', 'shadow-xs');
        toggleSplitBtn.classList.remove('text-slate-600');
        toggleScreenBtn.classList.remove('bg-white', 'text-brand-dark', 'shadow-xs');
        toggleScreenBtn.classList.add('text-slate-600');
        currentModeLabel.textContent = 'Dual View (Side-by-Side)';
      } else {
        toggleSplitBtn.classList.remove('bg-white', 'text-brand-dark', 'shadow-xs');
        toggleSplitBtn.classList.add('text-slate-600');
        toggleScreenBtn.classList.add('bg-white', 'text-brand-dark', 'shadow-xs');
        toggleScreenBtn.classList.remove('text-slate-600');

        if (currentSingleView === 'login') {
          loginPhone.classList.remove('hidden');
          signupPhone.classList.add('hidden');
          currentModeLabel.textContent = 'Single View (Login)';
        } else {
          loginPhone.classList.add('hidden');
          signupPhone.classList.remove('hidden');
          currentModeLabel.textContent = 'Single View (Sign Up)';
        }
      }
    }

    function switchToSignUp() {
      currentSingleView = 'signup';
      if (!isDualMode) {
        updateView();
      } else {
        signupPhone.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function switchToLogin() {
      currentSingleView = 'login';
      if (!isDualMode) {
        updateView();
      } else {
        loginPhone.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function toggleLoginPassword() {
      const pwd = document.getElementById('login-password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    function toggleSignUpPassword() {
      const pwd = document.getElementById('signup-password');
      pwd.type = pwd.type === 'password' ? 'text' : 'password';
    }

    toggleSplitBtn.addEventListener('click', () => {
      isDualMode = true;
      updateView();
    });

    toggleScreenBtn.addEventListener('click', () => {
      if (isDualMode) {
        isDualMode = false;
      } else {
        currentSingleView = currentSingleView === 'login' ? 'signup' : 'login';
      }
      updateView();
    });

    // Auto-detect mobile screen and switch default view to single screen for mobile convenience
    if (window.innerWidth < 768) {
      isDualMode = false;
      updateView();
    }
  </script>
  <!-- END: Interactive Switcher Logic -->

</body>
