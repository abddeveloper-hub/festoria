name: Deploy Vite React App to GitHub Pages

on:
  push:
    branches:
      - main # Change to 'master' if your default branch is master
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyATw_Lna2YpPJR86to1uw3uI9kkwb3HC5U' }}
          VITE_FIREBASE_PROJECT_ID: 'festoria-cd375'
          VITE_FIREBASE_AUTH_DOMAIN: 'festoria-cd375.firebaseapp.com'
          VITE_FIREBASE_STORAGE_BUCKET: 'festoria-cd375.firebasestorage.app'
          VITE_FIREBASE_MESSAGING_SENDER_ID: '416271261412'
          VITE_FIREBASE_APP_ID: '1:416271261412:web:dd8f76c08c474a1fe516f1'
        run: npm run build

      - name: Create 404.html fallback for React Router
        run: cp dist/index.html dist/404.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

